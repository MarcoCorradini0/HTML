<div class="app-container">
  <header class="main-header">
    <div class="logo">
      <span class="material-icons">fitness_center</span>
      <span>GYM<span class="highlight">TONIC</span></span>
    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <nav class="bottom-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
      <span class="material-icons">home</span>
      <span>Home</span>
    </a>
    <a routerLink="/exercises" routerLinkActive="active" class="nav-item">
      <span class="material-icons">list</span>
      <span>Exercises</span>
    </a>
    <a routerLink="/session/templates" routerLinkActive="active" class="nav-item">
      <span class="material-icons">folder_special</span>
      <span>Routines</span>
    </a>
    <a routerLink="/session/new" routerLinkActive="active" class="nav-item">
      <span class="material-icons">add_circle</span>
      <span>New Session</span>
    </a>
    <a routerLink="/session/history" routerLinkActive="active" class="nav-item">
      <span class="material-icons">history</span>
      <span>History</span>
    </a>
    <a routerLink="/progress" routerLinkActive="active" class="nav-item">
      <span class="material-icons">show_chart</span>
      <span>Progress</span>
    </a>
  </nav>
</div>
